spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/warzation}
    username: ${DB_USERNAME:warzation_dev}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: 8080

application:
  players:
    test-players:
      - id: jogador-1
        name: Jogador 1
        token: ${PLAYER_1_TOKEN}
      - id: jogador-2
        name: Jogador 2
        token: ${PLAYER_2_TOKEN}

# Ative este perfil com --spring.profiles.active=local.
# Defina DB_PASSWORD, PLAYER_1_TOKEN e PLAYER_2_TOKEN no ambiente ou substitua os
# valores apenas localmente (tokens com ao menos 16 caracteres, diferentes entre si).
# Nunca versione credenciais reais.
