spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/warzation}
    username: ${DB_USERNAME:warzation_dev}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: 8080

# Ative este perfil com --spring.profiles.active=local.
# Defina DB_PASSWORD no ambiente ou substitua os valores apenas localmente.
# Nunca versione credenciais reais.
