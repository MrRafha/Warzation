spring:
  datasource:
    url: jdbc:h2:mem:warzation;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration-h2

application:
  version: test
  economy:
    # Os testes avançam o tempo com um relógio controlado e chamam o EconomyClock.
    scheduler-enabled: false
  players:
    # Tokens fixos só para os testes automatizados.
    test-players:
      - id: jogador-1
        name: Jogador 1
        token: token-de-teste-jogador-1
      - id: jogador-2
        name: Jogador 2
        token: token-de-teste-jogador-2
      - id: jogador-3
        name: Jogador 3
        token: token-de-teste-jogador-3
