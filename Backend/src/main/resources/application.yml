spring:
  application:
    name: warzation-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/warzation}
    username: ${DB_USERNAME:warzation_dev}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 2KB

application:
  rules:
    # Acelera o ciclo econômico e as obras para testes manuais (1 = tempo real).
    # Ex.: GAME_SPEED=60 faz o ciclo de 1 h durar 1 min e uma Fazenda (2 h) ficar pronta em 2 min.
    speed: ${GAME_SPEED:1}
  web:
    # Origens do navegador autorizadas na API HTTP e no WebSocket (separadas por vírgula, sem '*').
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  match:
    # Início da partida. Valores PROVISÓRIOS PARA TESTE (Docs/01, seção 14.2).
    min-players-to-start: 2
    starting-infantry-per-province: 2   # Docs/01: 2 por província inicial, 6 por jogador
    neutral-garrison: 1                 # infantaria neutra em cada província sem dono
    initial-stock-per-province:         # estoque é local por província; vai para as 3 iniciais
      COMIDA: 60
      PEDRA: 20
  players:
    # Jogadores de teste do protótipo (provisório, sem contas). Defina os tokens no
    # ambiente ou em application-local.yml; token vazio desativa o jogador.
    test-players:
      - id: jogador-1
        name: Jogador 1
        token: ${PLAYER_1_TOKEN:}
      - id: jogador-2
        name: Jogador 2
        token: ${PLAYER_2_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health
      cors:
        allowed-origins: http://localhost:5173
        allowed-methods: GET
