spring:
  application:
    name: warzation-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/warzation}
    username: ${DB_USERNAME:warzation_dev}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 2KB

application:
  web:
    # Origens do navegador autorizadas na API HTTP e no WebSocket (separadas por vírgula, sem '*').
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  players:
    # Jogadores de teste do protótipo (provisório, sem contas). Defina os tokens no
    # ambiente ou em application-local.yml; token vazio desativa o jogador.
    test-players:
      - id: jogador-1
        name: Jogador 1
        token: ${PLAYER_1_TOKEN:}
      - id: jogador-2
        name: Jogador 2
        token: ${PLAYER_2_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health
      cors:
        allowed-origins: http://localhost:5173
        allowed-methods: GET
